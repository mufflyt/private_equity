# Frozen statistical analysis plan.
#
# The analysis reads this file and refuses to run if the model it is about to fit does not
# match the formula recorded here. The failure this prevents is real: an earlier power
# analysis reported a two-degree-of-freedom joint test of "any ownership effect" as though it
# were the interaction the plan names. Nothing in the code said otherwise, because nothing in
# the code said anything.
#
# Format: key = value. Blank lines and lines beginning with # are ignored. Every formula is
# compared after normalising whitespace, so reformatting is safe but reordering terms is not.
#
# CHANGING THIS FILE CHANGES THE PRE-SPECIFIED ANALYSIS. Do not edit it to make a run pass.
# Record the amendment, the date, and the reason in the amendments block at the foot, and
# regenerate the hash with:  Rscript -e 'source("R/analysis_gates.R"); sap_write_hash()'

version = 2026-08-10

# ---------------------------------------------------------------- primary obtainment
# PE vs independent among Medicaid calls only. Each clinician contributes one Medicaid call,
# so no clinician-level random effect is identifiable and none is specified.
obtainment_primary_formula   = obtained ~ pe + svi_z + (1 | pair)
obtainment_primary_family    = binomial
obtainment_primary_subset    = medicaid == 1
obtainment_primary_estimand  = pe
obtainment_primary_scale     = odds ratio

# ---------------------------------------------------------------- primary wait time
# The ownership-by-insurance interaction, tested alone. One degree of freedom.
waittime_primary_formula     = business_days ~ pe * medicaid + svi_z + (1 | pair) + (1 | npi)
waittime_primary_family      = nbinom2
waittime_primary_subset      = obtained == 1
waittime_primary_estimand    = pe:medicaid
waittime_primary_scale       = incidence rate ratio

# ---------------------------------------------------------------- secondary obtainment
obtainment_secondary_formula = obtained ~ pe * medicaid + svi_z + (1 | pair) + (1 | npi)
obtainment_secondary_family  = binomial
obtainment_secondary_estimand = pe:medicaid
obtainment_secondary_scale   = odds ratio

# ---------------------------------------------------------------- analytic population
# AMENDED 2026-08-24. The fielded frame contains 43 clinicians who cannot supply the
# appointment the study requests: 24 whose NPPES primary taxonomy is not obstetrics or
# gynecology, 18 at one of the five platforms the protocol already excludes (US Fertility,
# IVI RMA Global, Kindbody, OB Hospitalist Group), and 2 without an MD or DO credential.
# 40 of the 43 are PE-arm. They are called anyway, because the frame was fielded before this
# was found, but they are not the population the estimand refers to: an office that does not
# provide the service refuses or redirects, and a refusal concentrated ten to one in the
# treated arm is not evidence about access, it is evidence about eligibility.
#
# The primary analyses are therefore restricted to pairs in which BOTH members are eligible.
# Eligible is a committed column on the fielded sheet, derived as
#   Credentials in (MD, DO) AND Taxonomy_Is_OBGYN AND NOT Platform_Excluded
# and every input to it is committed alongside it, so the restriction is auditable rather
# than asserted. 156 of 200 pairs qualify. Analysing all 200 is sensitivity_6, not the
# primary, so the unrestricted result is always reported next to the restricted one.
analytic_population          = pairs where Eligible is TRUE for both members
analytic_population_column   = Eligible
analytic_population_n_pairs  = 156

# ---------------------------------------------------------------- shared settings
alpha                        = 0.05
sided                        = two
svi_column                   = CDC_SVI_real
clustering_unit              = npi
clustering_unit_sensitivity  = phone_id

# ---------------------------------------------------------------- assumed constants
# Every assumed magnitude must carry a source. An unsourced constant is a gate failure.
effect_primary_irr           = 1.22
effect_primary_irr_source    = Nie J et al. Urology 2022;164:112-117. doi:10.1016/j.urology.2022.01.055. Magnitude of the published PE-associated wait-time difference in the closest mystery-caller study; NOT a previously observed PE-by-insurance interaction.
effect_conservative_irr      = 1.10
effect_conservative_irr_source = Pre-specified conservative sensitivity; no external anchor claimed.
effect_larger_irr            = 1.35
effect_larger_irr_source     = Pre-specified optimistic sensitivity; no external anchor claimed.

# ---------------------------------------------------------------- prespecified sensitivity
sensitivity_1 = exclude pairs where same_phone_within_pair is TRUE
sensitivity_2 = cluster on phone_id rather than npi
sensitivity_3 = restrict to pairs where both members have an address-level SVI linkage
sensitivity_4 = refit without svi_z
sensitivity_5 = complete-case on all analytic covariates
sensitivity_6 = repeat the primary analyses on all 200 pairs, ignoring analytic_population
sensitivity_7 = restrict to pairs where both members are OB/GYN by taxonomy, ignoring platform

# ---------------------------------------------------------------- amendments
# date | section | change | reason
# 2026-08-10 | initial | frozen | first lock; svi_column set to the reconstructed measure
# because the original CDC_SVI column was established to be simulated (Appendix S2).
# 2026-08-24 | analytic population | added analytic_population, restricting the primary
# analyses to the 157 pairs whose members are both eligible, and added sensitivity_6 (all 200
# pairs) and sensitivity_7 (taxonomy only). Reason: checking all 400 fielded NPIs against the
# NPI Registry showed 43 clinicians who cannot supply the requested appointment, 40 of them
# PE-arm. The amendment is made BEFORE any call is placed and BEFORE any outcome exists, so
# it cannot have been chosen to favour a result. It narrows the population; it does not touch
# a formula, a family, an estimand or alpha.
# 2026-08-24 | analytic population | Taxonomy_Is_OBGYN corrected from a substring match on
# taxonomy descriptions to the CMS 207V family test on the primary taxonomy code, which is
# the standard the rest of the repository already uses. The loose rule admitted one nurse
# practitioner (363LW0102X, Women's Health) into the analytic population of a physician
# study, because a secondary taxonomy mentioned obstetrics. analytic_population_n_pairs
# falls from 157 to 156. Still before any call and any outcome.
