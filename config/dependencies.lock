# Dependency lockfile.
#
# The exact versions this analysis was last run against, so a result can be tied to an
# environment rather than to "whatever was installed that day".
#
# WHAT THIS IS. A provenance record and a completeness contract.
# WHAT THIS IS NOT. An installer, and not a pin on what CI installs. That question was
# already decided and reverted here (79e1ced pinned gates.yml to known-good SHAs, 9844370
# reverted it), so this file deliberately leaves gates.yml alone. See
# docs/APPENDIX_DEPENDENCIES.md for the tradeoff and who owns the decision.
#
# The one contract that IS gated, by tests/testthat/test-dependency-lockfile.R, is
# COMPLETENESS: every package the code actually loads must appear below. That compares code
# against this file, not against whatever is installed, so it holds in CI, where installed
# versions legitimately differ.
#
# Format: `<source> <name> <version> [sha]`; `key = value` for interpreter versions.
#   cran    installed from CRAN/RSPM
#   github  installed from a git remote; the sha is the commit resolved at record time
#   pypi    installed by pip, from requirements.txt
#
# Regenerate:  Rscript R/dependency_lock.R          (report gaps)
#              Rscript R/dependency_lock.R --drift  (compare against this machine)
# Both are reports. Update the versions below by hand, deliberately, in their own commit.

