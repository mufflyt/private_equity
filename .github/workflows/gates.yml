name: gates

# The cohort CSVs are gitignored, so CI can only run the data-independent blocking files plus
# the configuration gates: manifest integrity, the frozen analysis plan, its hash, and the
# requirement that the analysis runs its preflight before fitting anything. The full blocking
# set runs locally through hooks/pre-commit, where the data exists.

on:
  push:
    branches: [ main, adversarial-testing-loop ]
  pull_request:

jobs:
  blocking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::digest
            any::dplyr
            any::readr
            any::DBI
            any::duckdb
            github::mufflyt/mysterycall
            github::mufflyt/researchpaths
      - name: blocking gates (data-independent subset)
        run: Rscript tests/run_blocking.R --no-data
