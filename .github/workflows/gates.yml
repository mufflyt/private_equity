name: gates

# The cohort CSVs are gitignored, so CI can only run the data-independent blocking files plus
# the configuration gates: manifest integrity, the frozen analysis plan, its hash, and the
# requirement that the analysis runs its preflight before fitting anything. The full blocking
# set runs locally through hooks/pre-commit, where the data exists.
#
# mysterycall and researchpaths are pinned to specific commits (below), not floating main.
# This job blocks every commit and PR in this repo; before the pin, it also re-installed both
# dependencies fresh on every run, which meant a breaking change pushed to either repo's main --
# a renamed export, a removed function -- would fail every commit here regardless of whether
# this repo's own code was correct. nightly.yml intentionally keeps floating main instead: its
# whole purpose is catching that class of upstream drift on a schedule, without making it block
# day-to-day development here. Bump these SHAs deliberately, in their own commit, when a new
# mysterycall/researchpaths feature is actually needed -- not silently by omission.

on:
  push:
    branches: [ main, adversarial-testing-loop ]
  pull_request:

jobs:
  blocking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Deriv is pinned, and the pin is load-bearing. Deriv 4.3.0 (2026-07-23) added a C++
          # backend that calls R_ClosureFormals(), which is R's C API from 4.5.0 onward. This job
          # pins R to 4.4.2, so 4.3.0 cannot compile here and every run since 2026-08-23 died in
          # dependency installation before a single gate executed. 4.2.0 is pure R
          # (NeedsCompilation: no), so it cannot hit this at all. Deriv arrives transitively via
          # mysterycall's modelling stack. Remove the pin only when this job moves to R >= 4.5.
          packages: |
            any::testthat
            any::digest
            any::dplyr
            any::readr
            any::DBI
            any::duckdb
            Deriv@4.2.0
            github::mufflyt/mysterycall@42d66d92ef52a0f85d1f7c61208c2ddd79d9c06e
            github::mufflyt/researchpaths@26ec3f1981d66626bdf31f356b1097be0d7c1572
      - name: blocking gates (data-independent subset)
        run: Rscript tests/run_blocking.R --no-data
