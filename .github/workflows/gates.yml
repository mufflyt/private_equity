name: gates

# The cohort CSVs are gitignored, so CI can only run the data-independent blocking files plus
# the configuration gates: manifest integrity, the frozen analysis plan, its hash, and the
# requirement that the analysis runs its preflight before fitting anything. The full blocking
# set runs locally through hooks/pre-commit, where the data exists.
#
# tibble is in the install list below even though nothing in the current --no-data path calls
# it directly at present: gate_missingness() (R/analysis_gates.R) uses tibble::as_tibble(), and
# "not currently exercised by a nodata test" is not the same guarantee as "not needed" -- found
# by grepping the whole nodata-reachable file set for pkg::fn() calls, not just top-of-file
# library() (per ~/CI_BEST_PRACTICES.md item 2). Cheap to add now; an unexplained "no package
# called 'tibble'" the first time someone adds a nodata test that reaches gate_missingness()
# would not be cheap to debug later.
#
# The blocking-gates step has an explicit 15-minute timeout, distinct from the job/workflow
# default (GitHub's own unset default is 360 minutes). The suite runs in well under a minute
# normally; a step that hangs or degrades badly should fail fast and visibly rather than
# silently burn hours of Actions minutes before GitHub's default finally kills it.

on:
  push:
    branches: [ main, adversarial-testing-loop ]
  pull_request:

jobs:
  blocking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Deriv is pinned, and the pin is load-bearing. Deriv 4.3.0 (2026-07-23) added a C++
          # backend that calls R_ClosureFormals(), which is R's C API from 4.5.0 onward. This job
          # pins R to 4.4.2, so 4.3.0 cannot compile here and every run since 2026-08-23 died in
          # dependency installation before a single gate executed. 4.2.0 is pure R
          # (NeedsCompilation: no), so it cannot hit this at all. Deriv arrives transitively via
          # mysterycall's modelling stack. Remove the pin only when this job moves to R >= 4.5.
          packages: |
            any::testthat
            any::digest
            any::dplyr
            any::readr
            any::DBI
            any::duckdb
            any::tibble
            any::yaml
            Deriv@4.2.0
            github::mufflyt/mysterycall
            github::mufflyt/researchpaths
      - name: blocking gates (data-independent subset)
        timeout-minutes: 15
        run: Rscript tests/run_blocking.R --no-data
